name: iOS build and Swift tests

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: key-scratch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Compile iOS app and keyboard extension
        run: |
          xcodebuild -project Ortholinear.xcodeproj -scheme Ortholinear \
            -sdk iphonesimulator -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/KeyScratchBuild" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Test Swift core
        run: swift test
      - name: Package simulator app
        if: success()
        run: |
          cd "$RUNNER_TEMP/KeyScratchBuild/Build/Products/Release-iphonesimulator"
          zip -qr "$GITHUB_WORKSPACE/KeyScratch-simulator.zip" Ortholinear.app
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: KeyScratch-simulator
          path: KeyScratch-simulator.zip
          retention-days: 7
