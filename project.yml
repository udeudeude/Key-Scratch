name: Ortholinear
options:
  bundleIdPrefix: com.udeudeude
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.6.2"
    CURRENT_PROJECT_VERSION: "23"
    ORTHOLINEAR_APP_GROUP: group.com.udeudeude.KeyScratch
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Ortholinear:
    type: application
    platform: iOS
    sources:
      # Info.plist is excluded explicitly so a build that generates its own elsewhere
      # (the private Pro edition) doesn't copy this one in as a resource.
      - path: App
        excludes: [Info.plist]
      - Core
      - SharedUI
      - Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.udeudeude.KeyScratch
        INFOPLIST_KEY_CFBundleDisplayName: Key Scratch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrtholinearAppGroup: $(ORTHOLINEAR_APP_GROUP)
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.varyvoda.ortholinear.layout
            UTTypeDescription: Ortholinear layout
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [ortholayout]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    entitlements:
      path: App/Ortholinear.entitlements
      properties:
        com.apple.security.application-groups: [$(ORTHOLINEAR_APP_GROUP)]
    dependencies:
      - target: OrtholinearKeyboard
        embed: true
  OrtholinearKeyboard:
    type: app-extension
    platform: iOS
    sources: [KeyboardExtension, Core, SharedUI, Resources/PrivacyInfo.xcprivacy]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.udeudeude.KeyScratch.Keyboard
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: KeyboardExtension/Info.plist
      properties:
        CFBundleDisplayName: Key Scratch
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        OrtholinearAppGroup: $(ORTHOLINEAR_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: KeyboardExtension/OrtholinearKeyboard.entitlements
      properties:
        com.apple.security.application-groups: [$(ORTHOLINEAR_APP_GROUP)]
  OrtholinearUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Ortholinear
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.udeudeude.KeyScratch.UITests
  OrtholinearSystemTests:
    type: bundle.ui-testing
    platform: iOS
    sources: [IntegrationTests]
    dependencies:
      - target: Ortholinear
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.udeudeude.KeyScratch.SystemTests
schemes:
  Ortholinear:
    build:
      targets:
        Ortholinear: all
    # Compare an optimized Release run with the App Store's optimized Ortholinear.
    run:
      config: Release
    test:
      targets: [OrtholinearUITests]
  OrtholinearSystemTests:
    build:
      targets:
        Ortholinear: all
    test:
      targets: [OrtholinearSystemTests]
